apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spark-os-website
  namespace: abconvert
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: spark-os.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spark-os-website
                port:
                  number: 80
    - host: www.spark-os.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spark-os-website
                port:
                  number: 80
  tls:
    - hosts:
        - spark-os.io
        - www.spark-os.io
      secretName: spark-os-tls
