name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        type: choice
        required: true
        default: production
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: spark-os-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: image
        run: |
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${REPO_LOWER}:${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "staging_tag=${REGISTRY}/${REPO_LOWER}:staging" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REGISTRY}/${REPO_LOWER}:latest" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.staging_tag }}
            ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && steps.image.outputs.latest_tag || '' }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Write staging kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply staging manifests
        run: kubectl apply -k k8s/overlays/staging

      - name: Roll out staging image
        run: |
          kubectl -n abconvert set image deployment/spark-os-website web=${{ needs.build-and-push.outputs.image }}
          kubectl -n abconvert rollout status deployment/spark-os-website --timeout=180s
          kubectl -n abconvert get deployment,service,ingress spark-os-website -o wide

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Write production kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply production manifests
        run: kubectl apply -k k8s/overlays/production

      - name: Roll out production image
        run: |
          kubectl -n abconvert set image deployment/spark-os-website web=${{ needs.build-and-push.outputs.image }}
          kubectl -n abconvert rollout status deployment/spark-os-website --timeout=180s
          kubectl -n abconvert get deployment,service,ingress spark-os-website -o wide
